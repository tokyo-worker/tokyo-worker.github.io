- id: term-structure
  order: 4
  title: 金利の期間構造・債券のリスクプレミアム
  short: 期間構造・債券
  question: 満期ごとの金利(イールドカーブ)は何で決まり、債券の超過収益はなぜ予測できるのか。
  summary: Vasicekの無裁定モデル(短期金利の確率過程から全満期の価格を導く)を基準に、インフレ連動債(Jarrow–Yildirim)、投資家の選好する満期(Vayanos–Vila)、実証的な予測可能性(Cochrane–Piazzesi)が、どの仮定を足し引きしているかを読む群。国債市場・財政との接続記事も含む。
  keywords: ["期間構造", "イールド", "債券", "金利", "国債"]
  entry:
