# 論文群(ナビゲート記事)の定義
#
# ■ このファイルで決めること
#   - 論文群の名前・問い・入口の論文(entry)・初期メンバー(members)
# ■ サイト側が自動でやること(_plugins/paper_guides.rb)
#   - 各論文群のナビゲート記事 /guides/<id>/ を作る
#   - 関連論文ツリー、論文カード、共通文献(次に記事化すべき文献)などを、記事から自動生成する
#   - ここに載っていない新しい記事は、次の順で自動的にどれかの論文群に入る(必ず1つの群に属する)
#       1) 記事の front matter に  paper_group: <id>  があればそれ
#       2) 「主要文献・関連論文」の引用関係(直接の引用・共通文献)と、keywords の一致が最も多い群
#       3) どれにも当たらなければ fallback: true の群(other)
#     自動で入った記事は、ガイド上で「自動分類」バッジが付く。内容を確認して、
#     よければ該当群の members に追記する(またはfront matterに paper_group を書く)と確定する。
#
# ■ members / entry / also の書き方
#   記事のファイル名から日付と拡張子を除いたもの(slug)。同じ slug が複数ある場合だけ、日付付きで書く。
#     例) bohn-1998-us-public-debt-deficits
#         2026-10-18-can-deficits-finance-themselves   (同名の記事が2本あるため日付付き)
#   also: 主たる所属は別の群だが、この群のガイドにも載せたい記事(クロスリスト)
#
# ■ collections: [名前]
#   _posts 以外のコレクション(例: _ftpl の連載)を、この群のガイドに「関連連載」として載せる。
#   コレクションが増えたら、どれかの群に必ず書く(書き忘れるとビルドログに警告が出る)。
#
# ■ 新しい論文群を作るとき
#   下に1ブロック足すだけでよい。長い読み物(共通の設例など)は _guides/<id>.md に書く(任意)。

- id: asset-pricing
  order: 1
  title: 資産価格の理論：効率的市場・均衡・ポートフォリオ・ファクター
  short: 資産価格(均衡・効率的市場・ファクター)
  question: 資産の期待収益率は何で決まるのか。価格は予測できるのか。リスクの価格はどう測るのか。
  summary: 「価格は公正ゲーム(マルチンゲール)か」という問いから出発し、平均分散(Markowitz–Sharpe)、消費ベースの均衡(Lucas–Mehra–Prescott)、実証ファクター(Fama–French)へと進む系譜。価格を説明する言語が「分散・ベータ」から「割引ファクター」へ移っていく過程が読みどころ。
  keywords: ["効率的市場", "資産価格理論", "ポートフォリオ", "ファクター", "CAPM", "equity premium"]
  entry:
    - { post: fama-1970-efficient-capital-markets, why: "レビュー論文。効率性を「検証できる仮説」に言い換える枠組みを先に押さえると、他の論文の位置が見える。" }
    - { post: markowitz-portfolio-selection-1952, why: "平均と分散でリスクを測る、という出発点の言語。Sharpe・Fama–Frenchはこの言語の上に立つ。" }
  members:
