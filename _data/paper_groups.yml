- id: fiscal-sustainability
  order: 5
  title: 財政の持続可能性・財政ルール・公債の評価(物価水準の財政理論を含む)
  short: 財政の持続可能性・公債評価
  question: 政府債務は将来のどんな財政黒字で裏づけられるのか。債務が積み上がったとき、政府(と市場)はどう反応するのか。
  summary: 政府の異時点間予算制約(横断性条件)を共通の骨格として、(i) 財政黒字が債務に反応するか(Bohn)、(ii) 債務の市場価値は将来黒字の割引現在価値と合うのか(Jiang–Lustigら)、(iii) 格付け・金融抑圧・財政ルールがどう効くか、を読み比べる群。
