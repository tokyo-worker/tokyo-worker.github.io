- id: corporate-valuation
  order: 2
  title: 企業価値・資本構成・会計に基づく株式評価
  short: 企業価値(MM・残余利益)
  question: 企業の価値は、資本構成や配当政策、会計数値とどう結びつくのか。
  summary: 裁定による「無関連命題」(Modigliani–Miller)から、配当割引モデルとクリーンサープラス関係を使った会計ベースの評価(Ohlson, Feltham–Ohlson)へ。同じ「価値＝期待配当の現在価値」を、何を所与にして書き換えるかの違いとして読める。
  keywords: ["企業価値", "資本構成", "配当政策", "株式評価", "会計学", "財務"]
