- id: no-arbitrage-ccas
  order: 3
  title: 無裁定価格理論：オプション・マルチンゲール測度・偶発請求権(信用リスク・預金保険)
  short: 無裁定・オプション・偶発請求権
  question: 市場参加者の選好を知らなくても、複製と無裁定だけで価格はどこまで決まるのか。
  summary: Black–Scholes–Mertonの複製論法を、二項モデル(CRR)、マルチンゲール測度(Harrison–Kreps–Pliska)、ジャンプ(Merton 1976)へ広げ、さらに企業・銀行・国家のバランスシートに当てはめる(Merton 1974/1977、ソブリンCCA)系譜。「何が複製できるか(完備性)」が全体の分かれ目になる。
  keywords: ["オプション", "裁定", "マルチンゲール", "偶発請求権", "預金保険", "ソブリン", "CCA", "確率論"]
