- id: rg-olg-bubbles
  order: 6
  title: 世代重複モデル・r＜g・動学的効率性・公債のロールオーバーとバブル
  short: r＜g・OLG・公債バブル
  question: 利子率が成長率を下回る(r<g)とき、政府は債務を返さずに借り換え続けられるのか。それは世代の厚生に何をもたらすのか。
  summary: Samuelson(1958)の世代重複モデルを出発点に、Diamond(1965)の公債、Tirole(1985)のバブル、Abel–Mankiw–Summers–Zeckhauser(1989)の動学的効率性の検定、O'Connell–Zeldes(1988)・Kocherlakota(2023)のポンジ・ゲーム、Reis(2021)の r<g<m、といった「どの条件で借り換えが続くか」の系譜を読む群。
  keywords: ["世代重複", "OLG", "動学的効率性", "バブル", "ポンジ", "ロールオーバー", "r<g", "年金"]
  entry:
    - { post: samuelson-1958-consumption-loan, why: "r<gで何が起きるかを最も単純に示した原型。この群の全論文の出発点。" }
    - { post: abel-mankiw-summers-zeckhauser-dynamic-efficiency, why: "理論の「r<gか」という条件を、実データでどう判定するかを示す。理論と実証の橋渡し。" }
