<nav class="navbar navbar-expand-md fixed-top navbar-light" id="navbar">
  <div class="container">
    <a class="navbar-brand" href="{{ '/' | relative_url }}">
      <span class="font-weight-bold">{{ site.title }}</span>
    </a>

    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarContent"
      aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav ml-auto">

        <li class="nav-item">
          <a class="nav-link{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">
            <i class="fas fa-home mr-1"></i> Home
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link{% if page.url == '/about/' %} active{% endif %}" href="{{ '/about/' | relative_url }}">
            <i class="fas fa-user mr-1"></i> About
          </a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle{% if page.url == '/papers/' or page.url == '/paper-tree/' or page.layout == 'guide' or page.url == '/guides/' or page.guide_id %} active{% endif %}" href="#" id="papersDropdown" role="button"
             data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
            <i class="fas fa-list-ul mr-1"></i> 論文著者名リスト
          </a>
          <div class="dropdown-menu dropdown-menu-right papers-menu" aria-labelledby="papersDropdown">
            <a class="dropdown-item" href="{{ '/papers/' | relative_url }}"><i class="fas fa-user-edit mr-1"></i> 論文著者名リスト(著者順)</a>
            <a class="dropdown-item" href="{{ '/paper-tree/' | relative_url }}"><i class="fas fa-project-diagram mr-1"></i> 関連論文ツリー(全体)</a>
            <a class="dropdown-item" href="{{ '/guides/' | relative_url }}"><i class="fas fa-book-open mr-1"></i> 論文群ガイド一覧</a>
            <div class="dropdown-divider"></div>
            <h6 class="dropdown-header">論文群ガイド(ナビゲート記事)</h6>
            {% for g in site.data.guides %}
            <a class="dropdown-item{% if page.guide.id == g.id or page.guide_id == g.id %} active{% endif %}" href="{{ g.url | relative_url }}">{{ g.short | escape }} <span class="small text-muted">({{ g.count }})</span></a>
            {% endfor %}
          </div>
        </li>

        {% if site.show_rss %}
        <li class="nav-item">
          <a class="nav-link" href="{{ '/feed.xml' | relative_url }}" target="_blank" rel="noopener noreferrer">
            <i class="fas fa-rss mr-1"></i> RSS
          </a>
        </li>
        {% endif %}

      </ul>
    </div>
  </div>
</nav>
