title: "Random Thoughts on Economics from a Non‑Expert"
description: "経済(学)について思う事をつぶやきます。"
author: "tokyo-worker"
show_rss: false

url: "https://tokyo-worker.github.io"
baseurl: ""

lang: ja
timezone: Asia/Tokyo

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
  math_engine: mathjax
  parse_block_html: true

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Sass
sass:
  style: compressed

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - .github

# Post defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: default
