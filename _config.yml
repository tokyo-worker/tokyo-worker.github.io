title: "My Talks with AI"
description: "経済(学)等について思う事をAIと壁打ちした結果の徒然雑談倉庫です。"
author: "tokyo-worker"
show_rss: false

url: "https://tokyo-worker.github.io"
baseurl: ""

lang: ja
timezone: Asia/Tokyo

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
  math_engine: mathjax
  parse_block_html: true

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Sass
sass:
  style: compressed

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - .github

# Post defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      math_scripts:
        - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
        - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js
  - scope:
      path: ""
      type: pages
    values:
      layout: default